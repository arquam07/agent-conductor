# API is STATELESS -> Deployment (not StatefulSet). Any replica can serve any
# request; K8s can scale/replace them freely.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: agent-conductor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          # Local image loaded into kind; IfNotPresent so it won't try to pull
          image: agent-conductor-api:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.api.main", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ANTHROPIC_API_KEY
          # Liveness: is the process alive? Restart the pod if not.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          # Readiness: can it serve traffic (Redis reachable)? Hold traffic if not.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
# Service gives the API a stable in-cluster address and load-balances across
# replicas. ClusterIP = internal only; we reach it via port-forward for now,
# and via an Ingress later.
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: agent-conductor
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000